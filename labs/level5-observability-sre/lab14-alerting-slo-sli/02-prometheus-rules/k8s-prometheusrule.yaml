# =========================================================================
# ☸️ KUBERNETES PROMETHEUS OPERATOR: PROMETHEUS RULE CRD
# Target: Production AWS EKS Cluster
# =========================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: payment-vault-prometheus-rules
  namespace: monitoring
  labels:
    role: alert-rules
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: payment-vault
spec:
  groups:
    - name: payment-vault-k8s-alerts
      rules:
        - alert: PaymentVaultDown
          expr: up{job="payment-vault-service"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Payment Vault Service down on EKS"
            description: "Pod {{ $labels.pod }} is not reporting metrics."

        - alert: High5xxErrorRate
          expr: (sum(rate(http_requests_total{app="payment-vault", status=~"5.."}[1m])) / sum(rate(http_requests_total{app="payment-vault"}[1m]))) * 100 > 5
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "High 5xx error rate on EKS"
            description: "Error rate is {{ $value }}%."
