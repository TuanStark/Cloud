# =========================================================================
# 🔌 GRAFANA AUTOMATIC DATA SOURCE PROVISIONING
# =========================================================================
apiVersion: 1

datasources:
  # 1. Prometheus Metrics Data Source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # 2. Loki Logs Data Source
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
