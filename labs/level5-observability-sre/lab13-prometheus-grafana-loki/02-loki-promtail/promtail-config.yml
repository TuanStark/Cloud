# =========================================================================
# 🚚 PROMTAIL CONFIGURATION - HIGH-PERFORMANCE LOG SHIPPER
# =========================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: payment-vault-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: payment-vault
          env: production
          app: payment-vault-service
          __path__: /var/log/containers/*payment-vault*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            status: status
            method: method
            trace_id: trace_id
            msg: message
      - labels:
          level:
          status:
          method:
