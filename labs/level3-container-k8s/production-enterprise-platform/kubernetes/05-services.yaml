apiVersion: v1
kind: Service
metadata:
  name: order-frontend-service
  namespace: production-ecommerce
  labels:
    app: order-frontend
spec:
  type: ClusterIP
  selector:
    app: order-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: order-backend-service
  namespace: production-ecommerce
  labels:
    app: order-backend
spec:
  type: ClusterIP
  selector:
    app: order-backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      protocol: TCP
