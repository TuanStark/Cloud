apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-frontend
  namespace: production-ecommerce
  labels:
    app: order-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-frontend
  template:
    metadata:
      labels:
        app: order-frontend
        tier: web
    spec:
      # Phân bổ đều đa Availability Zone
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: order-frontend

      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # User 'nginx' trong image unprivileged
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: cache-volume
          emptyDir: {}
        - name: run-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}

      containers:
        - name: frontend
          image: ecommerce-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: cache-volume
              mountPath: /var/cache/nginx
            - name: run-volume
              mountPath: /var/run
            - name: tmp-volume
              mountPath: /tmp

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
