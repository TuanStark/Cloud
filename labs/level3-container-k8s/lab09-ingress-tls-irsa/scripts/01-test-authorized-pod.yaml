apiVersion: v1
kind: Pod
metadata:
  name: test-irsa-authorized
  namespace: order-app
spec:
  serviceAccountName: order-app-sa
  restartPolicy: Never
  containers:
    - name: aws-cli
      image: amazon/aws-cli:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "=== KIỂM TRA BIẾN MÔI TRƯỜNG DO EKS INJECT ==="
          env | grep AWS_
          echo "=== KIỂM TRA DANH TÍNH CALLER IDENTITY ==="
          aws sts get-caller-identity
          echo "=== KIỂM TRA TRUY CẬP S3 BUCKET ==="
          aws s3 ls
