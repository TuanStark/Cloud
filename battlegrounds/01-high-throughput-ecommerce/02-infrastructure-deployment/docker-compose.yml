services:
  # ============================================================================
  # POSTGRESQL PRIMARY (MASTER) - CHUYÊN XỬ LÝ GHI (WRITES)
  # ============================================================================
  postgres-primary:
    image: postgres:16-alpine
    container_name: ecommerce-pg-primary
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: PrimaryPassword2026!
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5434:5432"
    volumes:
      - ./database/primary/init-primary.sql:/docker-entrypoint-initdb.d/init-primary.sql:ro
      - pg_primary_data:/var/lib/postgresql/data
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c shared_buffers=128MB
      -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ============================================================================
  # POSTGRESQL STANDBY (REPLICA) - CHUYÊN XỬ LÝ ĐỌC (READ-ONLY)
  # ============================================================================
  postgres-replica:
    image: postgres:16-alpine
    container_name: ecommerce-pg-replica
    depends_on:
      postgres-primary:
        condition: service_healthy
    ports:
      - "5435:5432"
    volumes:
      - ./database/replica/entrypoint-replica.sh:/usr/local/bin/entrypoint-replica.sh:ro
      - pg_replica_data:/var/lib/postgresql/data
    entrypoint: ["/usr/local/bin/entrypoint-replica.sh"]
    command: >
      postgres
      -c hot_standby=on
      -c max_connections=200
      -c shared_buffers=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

  # ============================================================================
  # REDIS IN-MEMORY ENGINE - CACHE & ATOMIC INVENTORY
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6380:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-net

  # ============================================================================
  # APACHE KAFKA (KRAFT MODE) - HIGH-THROUGHPUT EVENT STREAMING
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: ecommerce-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-net

volumes:
  pg_primary_data:
  pg_replica_data:
  redis_data:
  kafka_data:

networks:
  ecommerce-net:
    driver: bridge
