# ============================================================================
# REDIS CONFIGURATION - HIGH-THROUGHPUT E-COMMERCE CACHE & INVENTORY
# Battleground 01: High-Throughput E-Commerce & Fintech Core
# ============================================================================

# Network & Ports
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (Tối ưu hóa bộ nhớ cho Flash Sale & Anti-Stampede)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence (Đảm bảo độ bền cho Hot Inventory counters)
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance Tuning
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
