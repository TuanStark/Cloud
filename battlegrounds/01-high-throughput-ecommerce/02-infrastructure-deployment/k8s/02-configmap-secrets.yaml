apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
data:
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  # Tầng Dữ liệu Aurora PostgreSQL (Trỏ vào endpoint RDS do Terraform khởi tạo trên Floci)
  PG_PRIMARY_HOST: "172.18.0.7"
  PG_PRIMARY_PORT: "5432"
  PG_REPLICA_HOST: "172.18.0.7"
  PG_REPLICA_PORT: "5432"
  POSTGRES_DB: "ecommerce_db"
  # Tầng In-Memory Cache & Event Bus
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-service:9092"
  KAFKA_TOPIC: "orders.events"
  KAFKA_GROUP_ID: "order-processing-group"
---
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secret
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
type: Opaque
stringData:
  POSTGRES_USER: "dbadmin"
  POSTGRES_PASSWORD: ":7JJgH30jP:LO[V*"
